syntax = "proto3";
package hudson.supervisor.v1;
import "guest.proto";

// Internal only. Every call requires mTLS and a configured controller identity.
service Supervisor {
  rpc ForgetAllocation(AllocationForgetRequest) returns (AllocationForgetObservation);
  rpc RetireAllocationMetadata(AllocationMetadataRequest) returns (AllocationMetadataObservation);
  rpc FenceAllocation(AllocationFenceRequest) returns (AllocationFenceObservation);
  rpc AllocationAuthority(AllocationAuthorityRequest) returns (AllocationAuthorityObservation);
  rpc RetireReleasedHistory(ReleasedHistoryRequest) returns (ReleasedHistoryObservation);
  rpc HistoryBinding(LeaseInspection) returns (HistoryBindingObservation);
  rpc RetireHistory(HistoryRequest) returns (HistoryObservation);
  rpc BeginFile(FileRequest) returns (FileObservation);
  rpc WriteFile(FileWriteRequest) returns (FileObservation);
  rpc InspectFile(FileRequest) returns (FileObservation);
  rpc CommitFile(FileRequest) returns (FileObservation);
  rpc AbortFile(FileRequest) returns (FileObservation);
  rpc PrepareOutput(OutputRequest) returns (OutputObservation);
  rpc ArchiveOutput(OutputRequest) returns (OutputObservation);
  rpc ExecuteCommand(CommandRequest) returns (CommandObservation);
  rpc InspectCommand(CommandInspection) returns (CommandObservation);
  // Idempotent interruption of the original execution identity, never Execute.
  rpc CancelCommand(CommandInspection) returns (CommandObservation);
  rpc Health(HealthRequest) returns (HostInfo);
  rpc Create(CreateRequest) returns (Observation);
  rpc Inspect(InspectRequest) returns (Observation);
  rpc Stop(StopRequest) returns (Observation);
  rpc RenewLease(LeaseRequest) returns (LeaseObservation);
  rpc InspectLease(LeaseInspection) returns (LeaseObservation);
  // Cleanup evidence for an older retained owner; never start or renew work.
  rpc ReconcilePreviousAllocation(PreviousAllocationRequest) returns (PreviousAllocationObservation);
  // Warm pools (#188). Each request/receipt is bounded sandbox_protocol::warm_pool
  // JSON. Prepare boots one unused VM that holds no project identity or secret.
  rpc PrepareWarmMember(WarmPrepareRequest) returns (WarmObservation);
  // Bind a prepared, never-used VM to exactly one registered allocation scope.
  rpc AdoptWarmMember(WarmAdoptRequest) returns (WarmObservation);
  // Lost-ack reconciliation: never adopts. An unadopted member is fenced against
  // this scope and reported rejected, so a late Adopt cannot apply afterwards.
  rpc InspectWarmHandoff(WarmAdoptRequest) returns (WarmObservation);
  // Destroy an unassigned member; never touches an adopted allocation.
  rpc RetireWarmMember(WarmRetireRequest) returns (WarmObservation);
}

message WarmPrepareRequest { bytes intent_json = 1; }
message WarmAdoptRequest {
  // Operation fencing for the create claim; must name the scope's allocation.
  Ownership ownership = 1;
  // Exact HandoffIntent persisted with the database claim.
  bytes intent_json = 2;
  // Registered allocation permit derived from that intent; the supervisor
  // requires both to match. Unregistered or mismatched permits never adopt.
  bytes launch_permit_json = 3;
  int64 allocation_expires_unix_ms = 4;
}
message WarmRetireRequest { bytes intent_json = 1; }
message WarmObservation {
  // Tagged sandbox_protocol::warm_pool::WarmReceipt.
  bytes receipt_json = 1;
  bool simulated = 2;
  int64 observed_unix_ms = 3;
}

message PreviousAllocationRequest {
  Ownership ownership = 1;
  int64 reporting_epoch = 2;
}
message PreviousAllocationObservation {
  PreviousAllocationRequest request = 1;
  Observation release = 2;
}

// A separate read-only service, authenticated with distinct API-reader pins.
// No command dispatch, journal mutation or allocation maintenance methods.
service LiveOutput {
  rpc Read(LiveOutputRequest) returns (LiveOutputObservation);
}
message LiveOutputRequest {
  bytes scope_json = 1;
  hudson.guest.v1.ReadOutput output = 2;
  int64 expires_unix_ms = 3;
}
message LiveOutputObservation {
  LiveOutputRequest request = 1;
  string host_id = 2;
  int64 supervisor_epoch = 3;
  bool simulated = 4;
  int64 observed_unix_ms = 5;
  hudson.guest.v1.OutputChunk chunk = 6;
  hudson.guest.v1.Receipt receipt = 7;
}

// Independent publication ownership, never an execution revision. JSON fields
// contain only bounded versioned OutputTicket/OutputPlans/OutputRefs metadata.
// Output bytes and credentials never cross this interface.
message OutputRequest {
  bytes ticket_json = 1;
  int64 publication_revision = 2;
  int64 claim_expires_unix_ms = 3;
  bytes plans_json = 4;
}
message OutputObservation {
  OutputRequest request = 1;
  string host_id = 2;
  int64 supervisor_epoch = 3;
  bool simulated = 4;
  int64 observed_unix_ms = 5;
  bytes plans_json = 6;
  bytes references_json = 7;
}
// Empty permits_json inspects durable progress; a nonempty JSON Permit array
// registers the next bounded contiguous batch. Neither response grants cleanup.
message AllocationAuthorityRequest {
  string host_id = 1;
  int64 reporting_epoch = 2;
  bytes permits_json = 3;
}
message AllocationAuthorityObservation {
  string host_id = 1;
  int64 reporting_epoch = 2;
  uint64 registered_through = 3;
}
message HealthRequest {}
message HostInfo {
  // Bounded versioned capability JSON. Empty is legacy, never a qualified host.
  bytes capabilities_json = 5;
  bool launch_permits_required = 4;
  string host_id = 1;
  int64 supervisor_epoch = 2;
  bool simulated = 3;
}
// Revisions fence ownership of an operation; generations fence VM incarnations.
// Both deadlines are absolute Unix milliseconds, bounded by supervisor policy.
message Ownership {
  string host_id = 1;
  string project_id = 2;
  string sandbox_id = 3;
  string allocation_id = 4;
  string operation_id = 5;
  int64 generation = 6;
  int64 supervisor_epoch = 7;
  int64 claim_revision = 8;
  int64 claim_expires_unix_ms = 9;
}
message Resources {
  uint32 vcpu = 1;
  uint64 memory_mib = 2;
  uint64 disk_mib = 3;
}
message CreateRequest {
  bytes launch_permit_json = 5;
  Ownership ownership = 1;
  string image_digest = 2;
  Resources resources = 3;
  int64 allocation_expires_unix_ms = 4;
}
message InspectRequest { Ownership ownership = 1; }
message StopRequest { Ownership ownership = 1; }
// Allocation maintenance is independent of completed customer operations.
message LeaseOwnership {
  string host_id = 1;
  string project_id = 2;
  string sandbox_id = 3;
  string allocation_id = 4;
  int64 generation = 5;
  int64 supervisor_epoch = 6;
  int64 revision = 7;
  int64 claim_expires_unix_ms = 8;
}
message LeaseRequest {
  LeaseOwnership ownership = 1;
  int64 allocation_expires_unix_ms = 2;
}
message LeaseInspection { LeaseOwnership ownership = 1; }
message LeaseObservation {
  LeaseOwnership ownership = 1;
  AllocationState state = 2;
  bool simulated = 3;
  int64 allocation_expires_unix_ms = 4;
  int64 observed_unix_ms = 5;
}
enum AllocationState {
  ALLOCATION_STATE_UNSPECIFIED = 0;
  // Absence is not permission to replay an uncertain command.
  ALLOCATION_STATE_ABSENT = 1;
  ALLOCATION_STATE_READY = 2;
  // VM stopped and all capacity released; not merely stop requested.
  ALLOCATION_STATE_RELEASED = 3;
  // This epoch confirmed absence AND fenced all future starts of this allocation.
  // Stronger evidence than ABSENT. Lost process state in a new epoch cannot supply it.
  ALLOCATION_STATE_FENCED_ABSENT = 4;
}
message Observation {
  Ownership ownership = 1;
  AllocationState state = 2;
  bool simulated = 3;
  uint64 start_count = 4;
  string create_operation_id = 5;
  int64 observed_unix_ms = 6;
  string reason = 7;
}

// Command payloads are bounded configuration, never output bytes or secrets.
message CommandRequest { Ownership ownership = 1; hudson.guest.v1.Execute command = 2; }
message CommandInspection { Ownership ownership = 1; bytes command_digest = 2; }
message CommandObservation {
  Ownership ownership = 1;
  bool simulated = 2;
  int64 observed_unix_ms = 3;
  bytes command_digest = 4;
  hudson.guest.v1.Receipt receipt = 5;
  // Durable fence: this operation was never dispatched and cannot start later.
  // Missing receipt without this fence is an unknown outcome.
  bool not_started = 6;
}

// All actions carry the original descriptor. Inspection never needs retained paths.
message FileRequest { Ownership ownership = 1; hudson.guest.v1.FileUpload upload = 2; }
message FileWriteRequest { FileRequest request = 1; uint64 offset = 2; bytes data = 3; }
message FileObservation {
  Ownership ownership = 1; bool simulated = 2; int64 observed_unix_ms = 3;
  bytes upload_digest = 4; hudson.guest.v1.Context context = 5;
  // Unspecified is absence of a guest observation, not a terminal result.
  hudson.guest.v1.FileState state = 6; bool not_started = 7; optional uint64 stored = 8;
}

// Optional read authority, configured independently of controller and output-reader pins.
service FileDownloads {
  rpc Capture(FileCaptureRequest) returns (FileAccessObservation);
  rpc Read(FileDownloadRequest) returns (FileAccessObservation);
  rpc Release(FileReleaseRequest) returns (FileAccessObservation);
}
message FileDownloadHandle {
  string id = 1;
  hudson.guest.v1.Context context = 2;
  hudson.guest.v1.FileCapture capture = 3;
  int64 expires_unix_ms = 4;
}
message FileCaptureRequest { bytes scope_json = 1; string path = 2; int64 expires_unix_ms = 3; }
message FileDownloadRequest {
  bytes scope_json = 1; FileDownloadHandle handle = 2;
  uint64 offset = 3; uint32 limit = 4; int64 expires_unix_ms = 5;
}
message FileReleaseRequest { bytes scope_json = 1; FileDownloadHandle handle = 2; int64 expires_unix_ms = 3; }
message FileAccessObservation {
  bytes scope_json = 1; bool simulated = 2; int64 observed_unix_ms = 3;
  oneof result {
    FileDownloadHandle captured = 4;
    hudson.guest.v1.FileChunk chunk = 5;
    FileDownloadHandle released = 6;
  }
}

// Controller asserts that original outcomes and required consumer retirement are durable.
// This independent per-domain claim does not reuse customer operation revisions.
message HistoryRequest {
  LeaseOwnership ownership = 1;
  hudson.guest.v1.HistoryBarrier barrier = 2;
}
message HistoryObservation {
  HistoryRequest request = 1;
  hudson.guest.v1.HistoryBarrier completed = 2;
  bool simulated = 3;
  int64 observed_unix_ms = 4;
}

// Authenticated read of the original bound boot; does not install a retirement floor.
message HistoryBindingObservation {
  LeaseInspection request = 1;
  hudson.guest.v1.Context context = 2;
  bool simulated = 3;
  int64 observed_unix_ms = 4;
}

// Allocation destruction is a separate proof from a guest history acknowledgement.
// Original ownership is retained; reporting_epoch identifies the serving host.
message ReleasedHistoryRequest {
  LeaseOwnership ownership = 1;
  int64 reporting_epoch = 2;
  hudson.guest.v1.HistoryDomain domain = 3;
  string through = 4;
}
message ReleasedHistoryObservation {
  ReleasedHistoryRequest request = 1;
  string completed_through = 2;
  AllocationState release_state = 3;
  bool simulated = 4;
  int64 observed_unix_ms = 5;
}

// Durable launch denial only: neither message proves physical release/deletion.
message AllocationFenceRequest { bytes request_json = 1; }
message AllocationFenceObservation {
  AllocationFenceRequest request = 1;
  int64 observed_unix_ms = 2;
}

// Physical cleanup verified and owned guardian metadata removed. Host completion
// remains retained until a separate database acknowledgement/forgetting protocol.
message AllocationMetadataRequest { bytes request_json = 1; }
message AllocationMetadataObservation {
  AllocationMetadataRequest request = 1;
  int64 observed_unix_ms = 2;
}

// Only the controller with retained database metadata completion issues this
// bounded ForgetRequest. Neither state below is a release/absence observation.
message AllocationForgetRequest { bytes request_json = 1; }
message AllocationForgetObservation {
  AllocationForgetRequest request = 1;
  AllocationForgetState state = 2;
  int64 observed_unix_ms = 3;
}
enum AllocationForgetState {
  ALLOCATION_FORGET_STATE_UNSPECIFIED = 0;
  ALLOCATION_FORGET_STATE_FORGOTTEN = 1;
  // Closed serial, original owner/scope no longer retained: denial only.
  ALLOCATION_FORGET_STATE_RETIRED = 2;
}
