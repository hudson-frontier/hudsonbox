[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hudsonbox-client"
version = "0.0.0"
description = "Project-scoped HTTPS client for Hudsonbox"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx==0.28.1"]

[tool.setuptools.package-data]
hudsonbox = ["py.typed"]
