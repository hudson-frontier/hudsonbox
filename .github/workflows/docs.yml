name: Documentation

on:
  # Every PR, including stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test runtime artifact preparation
        run: make runtime-artifacts-test
      - name: Test native source installation boundaries
        run: make source-install-check
      - name: Test CI scope detection
        run: python3 -m unittest discover -s scripts -p test_ci_scope.py
      - name: Check documentation
        run: python3 scripts/check_docs.py
      - name: Test local prerequisite diagnosis
        run: python3 -m unittest discover -s scripts -p test_doctor.py
      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD
