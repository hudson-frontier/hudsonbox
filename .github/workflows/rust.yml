name: Rust

on:
  # Every PR, including stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: Determine runtime scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - name: Check out complete PR history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          fi

  clients:
    name: Client, contract and image checks
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Generated Rust models are checked with the pinned rustfmt.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          rustfmt --version

      - name: Cache Python package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*requirements.txt') }}

      - name: Install filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs

      - name: Set up contract validation
        run: make api-setup

      - name: Validate OpenAPI and generated models
        run: make api

      - name: Set up Node for client conformance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.9.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Set up Python and TypeScript clients
        run: make sdk-setup

      - name: Validate client packages
        run: make sdk-check

      - name: Validate optional local MCP adapter
        run: |
          make mcp-setup
          make mcp-check

      - name: Validate guest image integrity and deterministic filesystem assembly
        run: make guest-image-check host-image-check

  rust-lint:
    name: Rust format and Clippy
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; this only reports what it
      # resolved to, so a failure is legible in the log.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          prefix-key: ubuntu-24.04-v2
          shared-key: lint
          cache-bin: false
          # PR caches would evict main's within the repository quota; PRs
          # restore main's cache and never save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust and integration tests
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # The schema tests skip when DATABASE_URL is unset, so CI must provide one
    # or the constraints this repository relies on would go unverified.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox -d sandbox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://sandbox:sandbox@127.0.0.1:5432/sandbox

    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; this only reports what it
      # resolved to, so a failure is legible in the log.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          prefix-key: ubuntu-24.04-v2
          shared-key: test
          cache-bin: false
          # PR caches would evict main's within the repository quota; PRs
          # restore main's cache and never save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install protobuf compiler and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler e2fsprogs postgresql-client-16
          protoc --version

      - name: Cache Python package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*requirements.txt') }}

      # Rust tests drive the OpenAPI validator and the Python/TypeScript
      # clients as external processes.
      - name: Set up contract validation
        run: make api-setup

      - name: Set up Node for client interoperability
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.9.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Set up Python and TypeScript clients
        run: |
          make sdk-setup
          npm run build --prefix sdk/typescript

      # Ordinary unprivileged object storage, never a KVM/host integration test.
      # Compose and CI share the same verified official source build recipe.
      - name: Cache pinned object storage image
        id: storage-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/hudson-storage-image
          # Exact recipe/context only; never load a different fixture as fallback.
          key: minio-v1-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('dev/object-storage/**') }}

      - name: Load cached test object storage
        if: steps.storage-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/hudson-storage-image/image.tar"

      - name: Build pinned test object storage
        if: steps.storage-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t hudson-output-fixture ./dev/object-storage
          mkdir -p "$RUNNER_TEMP/hudson-storage-image"
          docker save --output "$RUNNER_TEMP/hudson-storage-image/image.tar" hudson-output-fixture

      - name: Start private test object storage
        id: object-storage
        run: |
          container=$(docker run -d -p 127.0.0.1::9000 \
            -e MINIO_ROOT_USER=sandbox -e MINIO_ROOT_PASSWORD=sandbox-dev-secret \
            hudson-output-fixture server /data)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          storage_port=$(docker inspect -f '{{(index (index .NetworkSettings.Ports "9000/tcp") 0).HostPort}}' "$container")
          [[ "$storage_port" =~ ^[0-9]+$ ]]
          storage_endpoint="http://127.0.0.1:$storage_port"
          echo "endpoint=$storage_endpoint" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 60); do
            if curl -fsS "$storage_endpoint/minio/health/live" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$storage_endpoint/minio/health/live" > /dev/null
          docker exec "$container" sh -c \
            'MC_HOST_hudson="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" mc mb hudson/hudson-output-test'
          docker exec "$container" sh -c \
            'MC_HOST_hudson="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" mc mb hudson/hudson-output-version-test'
          docker exec "$container" sh -c \
            'MC_HOST_hudson="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" mc version enable hudson/hudson-output-version-test'

      - name: Build tests
        run: cargo test --workspace --no-run

      - name: Test
        run: cargo test --workspace

      - name: Test adopted guardian metadata retirement without KVM
        run: |
          cargo test -p sandbox-supervisor --lib --no-run --message-format=json > "$RUNNER_TEMP/guardian-tests.jsonl"
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          artifacts = [json.loads(line) for line in
                       Path(os.environ["RUNNER_TEMP"], "guardian-tests.jsonl").read_text().splitlines()]
          binaries = [a["executable"] for a in artifacts
                      if a.get("reason") == "compiler-artifact" and a.get("executable")
                      and a["target"]["name"] == "sandbox_supervisor"]
          assert len(binaries) == 1, binaries
          subprocess.run([
              "sudo", "-n", "env", "HUDSON_GUARDIAN_TEST_VM=1", binaries[0],
              "--exact", "guardian::retirement::tests::adopted_slot_metadata_retirement_resumes_exact_serialized_evidence",
              "--ignored",
          ], check=True)
          PYTHON

      - name: Verify private object storage semantics
        env:
          HUDSON_TEST_S3_ENDPOINT: ${{ steps.object-storage.outputs.endpoint }}
          HUDSON_TEST_S3_BUCKET: hudson-output-test
          HUDSON_TEST_S3_VERSIONED_BUCKET: hudson-output-version-test
          HUDSON_TEST_S3_ACCESS_KEY: sandbox
          HUDSON_TEST_S3_SECRET_KEY: sandbox-dev-secret
        run: python3 scripts/smoke_object_storage.py

      - name: Verify output storage and cleanup
        env:
          HUDSON_TEST_S3_ENDPOINT: ${{ steps.object-storage.outputs.endpoint }}
          HUDSON_TEST_S3_BUCKET: hudson-output-test
          HUDSON_TEST_S3_VERSIONED_BUCKET: hudson-output-version-test
          HUDSON_TEST_S3_ACCESS_KEY: sandbox
          HUDSON_TEST_S3_SECRET_KEY: sandbox-dev-secret
        run: |
          # Same package selection as the main test step, so this reuses its
          # build instead of re-resolving features and recompiling. `--skip
          # real_` excludes ignored real-host cases that need a KVM machine.
          cargo test --workspace output_minio -- --ignored --skip real_ --test-threads=1

      - name: Remove test object storage
        if: always()
        env:
          STORAGE_CONTAINER: ${{ steps.object-storage.outputs.container }}
        run: |
          if [[ -n "$STORAGE_CONTAINER" ]]; then docker rm -f "$STORAGE_CONTAINER"; fi

  # Keep the required status stable; scope failures and skipped runtime jobs
  # must not accidentally satisfy branch protection.
  rust-check:
    name: rust-check
    needs: [changes, clients, rust-lint, rust-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the applicable checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
          LINT_RESULT: ${{ needs.rust-lint.result }}
          TESTS_RESULT: ${{ needs.rust-tests.result }}
        run: |
          [[ "$SCOPE_RESULT" == "success" ]] || exit 1
          for result in "$CLIENTS_RESULT" "$LINT_RESULT" "$TESTS_RESULT"; do
            if [[ "$RUNTIME_REQUIRED" == "false" ]]; then
              [[ "$result" == "skipped" ]] || exit 1
            else
              [[ "$RUNTIME_REQUIRED" == "true" && "$result" == "success" ]] || exit 1
            fi
          done
          if [[ "$RUNTIME_REQUIRED" == "false" ]]; then
            echo "Documentation-only PR; documentation checks run separately."
          fi
