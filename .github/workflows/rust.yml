name: Rust

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-check:
    name: rust-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The schema tests skip when DATABASE_URL is unset, so CI must provide one
    # or the constraints this repository relies on would go unverified.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox -d sandbox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://sandbox:sandbox@127.0.0.1:5432/sandbox

    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; this only reports what it
      # resolved to, so a failure is legible in the log.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler e2fsprogs postgresql-client-16
          protoc --version

      - name: Set up contract validation
        run: make api-setup

      - name: Validate OpenAPI and generated models
        run: make api

      - name: Set up Node for client conformance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.9.0'

      - name: Set up Python and TypeScript clients
        run: make sdk-setup

      - name: Validate client packages
        run: make sdk-check

      - name: Validate optional local MCP adapter
        run: |
          make mcp-setup
          make mcp-check

      - name: Validate guest image integrity and deterministic filesystem assembly
        run: make guest-image-check host-image-check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Ordinary unprivileged object storage, never a KVM/host integration test.
      # Compose and CI share the same verified official source build recipe.
      - name: Build pinned test object storage
        run: docker build -t hudson-output-fixture ./dev/object-storage

      - name: Start private test object storage
        id: object-storage
        run: |
          container=$(docker run -d -p 127.0.0.1::9000 \
            -e MINIO_ROOT_USER=sandbox -e MINIO_ROOT_PASSWORD=sandbox-dev-secret \
            hudson-output-fixture server /data)
          echo "container=$container" >> "$GITHUB_OUTPUT"
          storage_port=$(docker inspect -f '{{(index (index .NetworkSettings.Ports "9000/tcp") 0).HostPort}}' "$container")
          [[ "$storage_port" =~ ^[0-9]+$ ]]
          storage_endpoint="http://127.0.0.1:$storage_port"
          echo "endpoint=$storage_endpoint" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 30); do
            if curl -fsS "$storage_endpoint/minio/health/live" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$storage_endpoint/minio/health/live" > /dev/null
          docker exec "$container" sh -c \
            'MC_HOST_hudson="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" mc mb hudson/hudson-output-test'
          docker exec "$container" sh -c \
            'MC_HOST_hudson="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" mc mb hudson/hudson-output-version-test'
          docker exec "$container" sh -c \
            'MC_HOST_hudson="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" mc version enable hudson/hudson-output-version-test'

      - name: Verify private object storage semantics
        env:
          HUDSON_TEST_S3_ENDPOINT: ${{ steps.object-storage.outputs.endpoint }}
          HUDSON_TEST_S3_BUCKET: hudson-output-test
          HUDSON_TEST_S3_VERSIONED_BUCKET: hudson-output-version-test
          HUDSON_TEST_S3_ACCESS_KEY: sandbox
          HUDSON_TEST_S3_SECRET_KEY: sandbox-dev-secret
        run: python3 scripts/smoke_object_storage.py

      - name: Verify output storage and cleanup
        env:
          HUDSON_TEST_S3_ENDPOINT: ${{ steps.object-storage.outputs.endpoint }}
          HUDSON_TEST_S3_BUCKET: hudson-output-test
          HUDSON_TEST_S3_VERSIONED_BUCKET: hudson-output-version-test
          HUDSON_TEST_S3_ACCESS_KEY: sandbox
          HUDSON_TEST_S3_SECRET_KEY: sandbox-dev-secret
        run: |
          # Explicit unprivileged packages: workspace-wide ignored tests would
          # also select real-host cases requiring a controlled KVM machine.
          cargo test -p sandbox-artifacts -p sandbox-controller -p sandbox-api -p sandbox-store -p sandbox-cleanup \
            output_minio -- --ignored --test-threads=1

      - name: Remove test object storage
        if: always()
        env:
          STORAGE_CONTAINER: ${{ steps.object-storage.outputs.container }}
        run: |
          if [[ -n "$STORAGE_CONTAINER" ]]; then docker rm -f "$STORAGE_CONTAINER"; fi
