[package]
name = "sandbox-supervisor"
description = "Host resources, jailer, Firecracker, snapshots, and leases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rcgen = { workspace = true }
time = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
tokio-rustls = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
prost = { workspace = true }
sandbox-protocol = { workspace = true }
sandbox-artifacts = { workspace = true }
sha2 = { workspace = true }
tonic = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tokio-stream = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
sandbox-controller = { path = "../sandbox-controller" }
sandbox-api = { path = "../sandbox-api" }
sandbox-store = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
sqlx = { workspace = true }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }

[lints]
workspace = true
