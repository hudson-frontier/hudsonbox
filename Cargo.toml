[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/hudson-frontier/hudsonbox"
publish = false

# Dependency choices are recorded here as they are made. Cargo only resolves an
# entry once a member crate uses it, so declaring one ahead of its first use
# costs nothing and keeps the choice in one place. Pin the exact version when
# the first crate actually takes the dependency.
[workspace.dependencies]
base64 = "0.22"
percent-encoding = "2"
sandbox-client = { path = "crates/sandbox-client" }
sandbox-protocol = { path = "crates/sandbox-protocol" }
sandbox-store = { path = "crates/sandbox-store" }
sandbox-supervisor = { path = "crates/sandbox-supervisor" }
sandbox-artifacts = { path = "crates/sandbox-artifacts" }
# S3 transport uses the workspace's existing ring provider, never a second
# default TLS provider. Explicit credentials and endpoints only.
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
futures-util = "0.3"
url = "2"

prost = "=0.14.3"
tonic = { version = "=0.14.6", features = ["tls-ring"] }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
tokio-stream = { version = "0.1", features = ["net"] }
rcgen = "=0.14.10"

anyhow = "1"
axum = "0.8"
getrandom = "0.3"
hex = "0.4"
libc = "=0.2.189"
http = "1"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "service"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tempfile = "=3.27.0"
tokio-vsock = "=0.7.2"
rustix = { version = "=1.1.5", features = ["fs", "process", "thread", "mount", "time", "net"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = 1
