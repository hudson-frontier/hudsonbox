# Local development dependencies. Not a deployment topology — see
# docs/local-development.md.
#
# Ports are deliberately off the defaults. A developer with PostgreSQL already
# installed will otherwise have the container bind :: while 127.0.0.1 stays
# with their native server, and every connection from the host silently
# reaches the wrong database. That failure looks like a missing role, not a
# port conflict, so it is worth avoiding by construction.
name: hudsonbox-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${HUDSON_POSTGRES_USER:-sandbox}
      POSTGRES_PASSWORD: ${HUDSON_POSTGRES_PASSWORD:-sandbox}
      POSTGRES_DB: ${HUDSON_POSTGRES_DB:-sandbox}
    ports:
      - "127.0.0.1:${HUDSON_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Official MinIO and mc built from reviewed immutable source inputs.
    build: ./dev/object-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HUDSON_MINIO_ROOT_USER:-sandbox}
      MINIO_ROOT_PASSWORD: ${HUDSON_MINIO_ROOT_PASSWORD:-sandbox-dev-secret}
    ports:
      - "127.0.0.1:${HUDSON_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${HUDSON_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_hudson=http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@127.0.0.1:9000 mc ready hudson"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:
